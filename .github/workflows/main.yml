name: CI/CD Pipeline

on:
push:
branches: [ "main" ]

jobs:
build-and-deploy:
runs-on: ubuntu-latest

```
steps:
  # 1️⃣ Checkout code
  - name: Checkout repository
    uses: actions/checkout@v4

  # 2️⃣ Setup Docker Buildx
  - name: Setup Docker Buildx
    uses: docker/setup-buildx-action@v3

  # 3️⃣ Login to Docker Hub
  - name: Login to Docker Hub
    uses: docker/login-action@v3
    with:
      username: ${{ secrets.DOCKERHUB_USERNAME }}
      password: ${{ secrets.DOCKERHUB_TOKEN }}

  # 4️⃣ Build & Push Backend Image
  - name: Build and Push Backend
    uses: docker/build-push-action@v6
    with:
      context: ./backend
      push: true
      tags: ${{ secrets.DOCKERHUB_USERNAME }}/fusionpact-backend:latest

  # 5️⃣ Build & Push Frontend Image
  - name: Build and Push Frontend
    uses: docker/build-push-action@v6
    with:
      context: ./frontend
      push: true
      tags: ${{ secrets.DOCKERHUB_USERNAME }}/fusionpact-frontend:latest

  # 6️⃣ Deploy to EC2
  - name: Deploy to EC2
    uses: appleboy/ssh-action@v1.1.0
    with:
      host: ${{ secrets.EC2_HOST }}
      username: ${{ secrets.EC2_USER }}
      key: ${{ secrets.EC2_SSH_KEY }}
      script: |
        cd ~/fusionpact-devops-challenge
        echo "Pull latest code"
        git pull origin main
        echo "Stop old containers"
        docker compose down
        echo "Pull latest images"
        docker pull ${{ secrets.DOCKERHUB_USERNAME }}/fusionpact-backend:latest
        docker pull ${{ secrets.DOCKERHUB_USERNAME }}/fusionpact-frontend:latest
        echo "Start containers"
        docker compose up -d
```
